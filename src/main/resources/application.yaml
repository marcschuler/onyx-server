spring:
  application:
    name: onyx
  data:
    web:
      pageable:
        default-page-size: 50
        max-page-size: 1000
  datasource:
    url: jdbc:h2:file:${onyx.storage.database}/onyx
    driver-class-name: org.h2.Driver
    username: onyx
    password: onyx
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/liquibase.yaml
    # default-data creates the default server on the first start
    contexts: default-data
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  api-docs:
    path: /openapi
  model-converters:
    polymorphic-converter:
      enabled: true

onyx:
  auth:
    # comma-separated list of hostnames clients may sign challenges for
    server: http://localhost:8080
    expire-login: 1m
    jwt:
      expiration: 5m
      refresh: 4m
  storage:
    path: /data
    database: ${onyx.storage.path}/database
    files:
      files: ${onyx.storage.path}/files/files
      cache: ${onyx.storage.path}/cache/files
    integration-steam:
      files: ${onyx.storage.path}/cache/steam
      cache: ${onyx.storage.path}/cache/files
  game-integration:
    steam:
      scheduler: 0 * * * * *

webrtc:
